name: Build Child Safety APKs

on:
  workflow_dispatch:
  push:
    paths:
      - "ChildSafetyAndroidStudio.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -q ChildSafetyAndroidStudio.zip -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build both APKs
        run: |
          gradle -p project \
            :parentApp:assembleDebug \
            :childApp:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ChildSafety-APKs
          path: |
            project/parentApp/build/outputs/apk/debug/*.apk
            project/childApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
